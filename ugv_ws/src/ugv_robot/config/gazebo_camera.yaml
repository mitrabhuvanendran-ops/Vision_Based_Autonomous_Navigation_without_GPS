%YAML:1.0

# Camera calibration and distortion (Standard Gazebo pinhole)
Camera.type: "PinHole"

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera intrinsics (calculated for 80-deg FOV at 640x480)
Camera.fx: 381.39
Camera.fy: 381.39
Camera.cx: 320.0
Camera.cy: 240.0

# Distortion parameters (rectified in Gazebo)
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.fps: 30
Camera.RGB: 1

# ORB Feature Extraction Settings
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Pangolin Viewer Parameters
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
